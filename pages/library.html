<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browse Library - SEPA Resource Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css?v=0.27.49">
</head>
<body class="home page-red">

<!-- BROWSE LIBRARY (v0.27). Every public document, in groups, drawn from the Google Drive folder
     "SEPA Library Files" (sepalibrary account). Nothing to edit here to add or remove a document:
     do it in Drive and this page catches up within about 10 minutes (see js/library.js).
       - Each folder in "SEPA Library Files" is a group. Folders inside it are subheadings.
       - The group order is GROUP_ORDER below. A new folder not in that list goes at the end.
       - The search box is the same site search as the homepage (js/search.js). -->

<div class="page-wrap page-wide">

  <header class="page-top">
    <a class="page-logo-card" href="../index.html"><img class="page-logo" src="../images/logo.png" alt="SEPA Resource Library home"></a>
    <a class="back-link" href="../index.html">&times; Close this tab</a>
  </header>

  <h1 class="page-title">Browse Library</h1>
  <p class="page-intro" id="lib-intro">Guides, forms, and training for SEPA volunteers. Search, or jump to a group.</p>

  <div class="mc-head lib-head">
    <label class="mc-search"><span class="visually-hidden">Search the whole site</span>
      <input type="search" id="site-q" placeholder="Search everything, e.g. 6409, intake, pets, DMH" autocomplete="off"></label>
  </div>
  <div class="ss-panel" id="ss-panel" hidden></div>

  <div id="lib-browse">
    <nav class="lib-jump" id="lib-jump" aria-label="Groups"></nav>
    <p class="mc-hint">Click a title to open it, or Download to save a copy.</p>
    <div class="mc-resources lib-resources" id="lib-list"><p class="lib-note">Loading the library&hellip;</p></div>
  </div>

</div>

<script src="../js/config.js?v=0.27.49"></script>
<script src="../js/library.js?v=0.27.49"></script>
<script src="../js/search-data.js?v=0.27.49"></script>
<script src="../js/search.js?v=0.27.49"></script>
<script>
(function () {
  var GROUP_ORDER = ['Getting Started', 'Response Guides and Forms', 'Duty Officer Resources', 'IDC Resources', 'Mass Care Resources',
    'Mass Care', 'Volunteer Leadership Tools', 'Training Presentations', 'Tools for Instructors', 'DAT Chats and Events', 'Videos'];
  var LABELS = { 'IDC Resources': 'Individual Disaster Care (IDC) Resources' };
  var list = document.getElementById('lib-list'), jump = document.getElementById('lib-jump');

  SEPALib.load(function (lib) {
    if (!lib) { list.innerHTML = '<p class="lib-note">The library could not be loaded right now. Please check your connection and try again in a minute.</p>'; return; }
    var html = '', chips = '', total = 0;
    SEPALib.ordered(lib.groups, GROUP_ORDER).forEach(function (g) {
      var id = SEPALib.slug(g), sec = SEPALib.sectionHtml(id, LABELS[g] || g, SEPALib.underPath(lib, g));
      if (!sec.n) return;
      html += sec.html; total += sec.n;
      chips += '<a href="#' + id + '">' + SEPALib.esc(LABELS[g] || g) + ' <span>' + sec.n + '</span></a>';
    });
    var loose = lib.files.filter(function (f) { return !f.path; }).sort(SEPALib.byTitle);
    if (loose.length) {
      var s = SEPALib.sectionHtml('other', 'Other', [{ sub: '', files: loose }]);
      html += s.html; total += s.n; chips += '<a href="#other">Other <span>' + s.n + '</span></a>';
    }
    list.innerHTML = html;
    jump.innerHTML = chips;
    document.getElementById('lib-intro').textContent = 'Guides, forms, and training for SEPA volunteers: ' + total + ' items. Search, or jump to a group.';
    if (location.hash && !document.getElementById('site-q').value) {
      var t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView();
    }
  });

  SEPASearch.attach(document.getElementById('site-q'), document.getElementById('ss-panel'), [document.getElementById('lib-browse')], '../');
})();
</script>
<script src="../js/close-tab.js?v=0.27.49"></script>
</body>
</html>
