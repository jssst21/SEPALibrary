<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mass Care - SEPA Resource Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css?v=0.27.6">
</head>
<body class="home page-red">

<!-- MASS CARE (v0.25; files from Google Drive since v0.27). Red page like Contacts, Onboarding and the Forums.
     Top: four big buttons. Below: every file in the Google Drive folder "SEPA Library Files / Mass Care
     Resources", drawn by js/library.js. Files sitting loose in that folder are "Start here"; each folder
     inside it is a group (order: SECTION_ORDER below; new folders go at the end).
     To add, remove or rename a file: do it in Drive. Nothing to edit here.
     VIDEOS (the last group) are listed by name in VIDEOS below, from the Drive folder "Videos", plus the
     YouTube playlist. -->

<div class="page-wrap page-wide">

  <header class="page-top">
    <a class="page-logo-card" href="../index.html"><img class="page-logo" src="../images/logo.png" alt="SEPA Resource Library home"></a>
    <a class="back-link" href="../index.html">&times; Close this tab</a>
  </header>

  <h1 class="page-title">Mass Care</h1>

  <!-- The four big buttons. "Launch SCIA" goes to the same address as SCIA in the homepage's Quick launch bar. -->
  <nav class="mc-launch" aria-label="Mass Care tools">
    <a class="mc-btn mc-btn-main" href="https://www.redcross.org/scia" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7h-2V6.4l-9.3 9.3-1.4-1.4L17.6 5H14V3zM5 5h6v2H5v12h12v-6h2v8H3V5h2z"/></svg>
      <span>Launch SCIA</span></a>
    <a class="mc-btn" href="escalation.html" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l10 18H2L12 2zm0 4.3L5.4 18h13.2L12 6.3zM11 10h2v4h-2v-4zm0 5h2v2h-2v-2z"/></svg>
      <span>Escalation Form</span></a>
    <a class="mc-btn" href="reception.html" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2h10v2h3v18H4V4h3V2zm2 2v2h6V4H9zM6 6v14h12V6h-1v2H7V6H6zm2 5h8v2H8v-2zm0 4h6v2H8v-2z"/></svg>
      <span>Reception Center Form</span></a>
    <a class="mc-btn" href="contacts.html" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4a4 4 0 110 8 4 4 0 010-8zm0 2a2 2 0 100 4 2 2 0 000-4zm0 8c3.3 0 7 1.6 7 4v2H3v-2c0-2.4 3.7-4 7-4zm0 2c-2.6 0-4.7 1.1-5 2h10c-.3-.9-2.4-2-5-2zm9.5-7.5l1.4 1.4-2.1 2.1 2.1 2.1-1.4 1.4-2.1-2.1V9.6l2.1-2.1z"/></svg>
      <span>Find someone in the Red Cross that you need</span></a>
  </nav>

  <div class="mc-resources">
    <div class="mc-head">
      <h2 class="mc-h">Mass Care Resources</h2>
      <label class="mc-search"><span class="visually-hidden">Search the whole site</span>
        <input type="search" id="site-q" placeholder="Search everything, e.g. pets, intake, minors" autocomplete="off"></label>
    </div>
    <div class="ss-panel" id="ss-panel" hidden></div>
    <div id="mc-browse">
      <p class="mc-hint">Click a title to open it, or Download to save a copy.</p>
      <div id="mc-list"><p class="lib-note">Loading the resources&hellip;</p></div>
    </div>
  </div>

</div>

<script src="../js/config.js?v=0.27.6"></script>
<script src="../js/library.js?v=0.27.6"></script>
<script src="../js/search-data.js?v=0.27.6"></script>
<script src="../js/search.js?v=0.27.6"></script>
<script>
(function () {
  var FOLDER = 'Mass Care Resources';
  var SECTION_ORDER = ['Important Forms', 'Sheltering', 'Helping Clients with Disabilities', 'Feeding Resources',
    'Military Connected Clients', 'Logistics Resources', 'SCIA Resources'];
  var VIDEOS = ['Videos/Primer on SCIA Interface Changes', 'Videos/Volunteer Training for Family Resource Centers', 'Videos/Mass Care Feeding Workshop'];
  var PLAYLIST = 'https://www.youtube.com/playlist?list=PLkWdjWl12oHxw2Tn-9CIe-sxVXbx6M04k';
  var box = document.getElementById('mc-list');

  SEPALib.load(function (lib) {
    if (!lib) { box.innerHTML = '<p class="lib-note">The resources could not be loaded right now. Please check your connection and try again in a minute.</p>'; return; }
    var parts = SEPALib.underPath(lib, FOLDER), bySection = {}, names = [], html = '';
    parts.forEach(function (p) {
      var top = p.sub.split(' \u203a ')[0], rest = p.sub.split(' \u203a ').slice(1).join(' \u203a ');
      if (!p.sub) top = '';
      if (!bySection[top]) { bySection[top] = []; if (top) names.push(top); }
      bySection[top].push({ sub: rest, files: p.files });
    });
    if (bySection['']) html += SEPALib.sectionHtml('start-here', 'Start here', bySection['']).html;
    SEPALib.ordered(names, SECTION_ORDER).forEach(function (n) { html += SEPALib.sectionHtml(SEPALib.slug(n), n, bySection[n]).html; });
    var vids = VIDEOS.map(function (v) { return SEPALib.find(lib, v); }).filter(Boolean);
    html += '<section class="mc-section" id="videos"><h2 class="people-head">Videos <span class="mc-count">' + (vids.length + 1) + '</span></h2><ul class="mc-list">' +
      vids.map(function (f) { return SEPALib.itemHtml(f); }).join('') +
      '<li class="mc-item"><span class="mc-type mc-link">YouTube</span><a class="mc-title" href="' + PLAYLIST + '" target="_blank" rel="noopener">Specialty Driver Videos (YouTube playlist)</a><span class="mc-meta">Opens YouTube</span></li></ul></section>';
    box.innerHTML = html;
  });

  SEPASearch.attach(document.getElementById('site-q'), document.getElementById('ss-panel'), [document.getElementById('mc-browse')], '../');
})();
</script>
<script src="../js/close-tab.js?v=0.27.6"></script>
</body>
</html>
