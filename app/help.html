<!-- CALL FOR HELP (website v0.27.11). App-only page, reached from the "Call for Help" button in the SEPA Tools
     app. Not linked from the public website and marked noindex. Each card is a tel: link, so tapping it
     dials that person. To add someone, copy one <a class="person"> block and change the number (twice:
     the tel: address and the aria-label), the photo and the name. Photos come from images/people/. -->
<style>
  :root { --red: #ae273a; --ink: #2a2420; --navy: #1f3556; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--red); color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 18px);
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  .back { display: inline-flex; align-items: center; gap: 4px; padding: 8px 12px 8px 6px; margin-left: -6px; border-radius: 10px; color: #fff; font-size: 16px; font-weight: 700; text-decoration: none; }
  .back svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .back:active { background: rgba(0,0,0,.15); }
  h1 { margin: 6px 0 2px; font-size: 30px; letter-spacing: .02em; text-align: center; }
  .sub { margin: 0 0 18px; text-align: center; font-size: 15px; opacity: .9; }
  .list { display: flex; flex-direction: column; gap: 12px; }
  .person {
    display: flex; align-items: center; gap: 16px; min-height: 88px; padding: 12px 14px 12px 12px; border-radius: 18px;
    background: #fff; color: var(--ink); text-decoration: none;
    box-shadow: 0 3px 8px rgba(60, 8, 16, .35); transition: transform .1s;
  }
  .person:active { transform: scale(.98); }
  .person:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .person img { flex: none; width: 64px; height: 64px; border-radius: 50%; object-fit: cover; background: #eee; }
  .person .name { flex: 1; min-width: 0; font-size: 21px; font-weight: 700; line-height: 1.2; }
  .person .call { flex: none; display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; background: #1e8e3e; }
  .person .call svg { width: 26px; height: 26px; fill: #fff; }
  .person .badge { flex: none; display: grid; place-items: center; width: 64px; height: 64px; border-radius: 50%; background: var(--navy); }
  .person .badge svg { width: 34px; height: 34px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .person.hotline { margin-bottom: 8px; }
  .note { margin: 18px 0 0; font-size: 13.5px; text-align: center; opacity: .9; }
  @media (max-width: 340px) { .person .name { font-size: 18px; } .person img { width: 54px; height: 54px; } }
  @media (prefers-reduced-motion: reduce) { .person { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
